name: Atualizar estatísticas de linguagens

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gerar gráfico de linguagens
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/languages.svg
          include-title: false
          colors: dark
          max-languages: 8
          hide-keys: general, repositories, contributions
          category-order: languages
          locale: pt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
